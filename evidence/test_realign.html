<!DOCTYPE html>
<html>
<head>
<style>
body { background: #111D30; padding: 40px; display: flex; gap: 20px; font-family: sans-serif; color: white; }
.card { width: 280px; }
.box { width: 280px; height: 380px; border-radius: 16px; overflow: hidden; background: #000; position: relative; }
img { width: 100%; height: 100%; object-fit: cover; }
.p1 { object-position: 78% 20%; }
.p2 { object-position: 75% 25%; }
.p3 { object-position: 82% 20%; }
</style>
</head>
<body>
<div class='card'><h3>78% 20%</h3><div class='box'><img class='p1' src='https://images.unsplash.com/photo-1758518729466-827cd8293992?auto=format&fit=crop&w=800&q=80'></div></div>
<div class='card'><h3>75% 25%</h3><div class='box'><img class='p2' src='https://images.unsplash.com/photo-1758518729466-827cd8293992?auto=format&fit=crop&w=800&q=80'></div></div>
<div class='card'><h3>82% 20%</h3><div class='box'><img class='p3' src='https://images.unsplash.com/photo-1758518729466-827cd8293992?auto=format&fit=crop&w=800&q=80'></div></div>
</body>
</html>
