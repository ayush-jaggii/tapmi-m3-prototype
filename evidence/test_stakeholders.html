<!DOCTYPE html>
<html>
<head>
<style>
body { background: #111D30; color: #fff; font-family: -apple-system, sans-serif; padding: 30px; }
.grid { display: grid; grid-template-columns: repeat(4, 280px); gap: 24px; }
.card { background: #1a283e; border-radius: 16px; overflow: hidden; }
.img-wrap { width: 280px; height: 350px; overflow: hidden; background: #000; }
img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; }
.p { padding: 16px; font-size: 14px; }
h4 { margin: 0 0 6px 0; font-size: 16px; color: #f58232; }
</style>
</head>
<body>
<h2>Stakeholder Perspectives Comparison</h2>
<div class='grid'>
  <div class='card'>
    <div class='img-wrap'><img src='https://images.unsplash.com/photo-1778692258270-bc0e80e975c0?auto=format&fit=crop&w=1000&q=85'></div>
    <div class='p'><h4>1. Corporate Sponsor</h4>(Existing good photo)</div>
  </div>
  <div class='card'>
    <div class='img-wrap'><img src='https://images.unsplash.com/photo-1762341124796-530c0085f7d8?auto=format&fit=crop&w=1000&q=85'></div>
    <div class='p'><h4>2. Executive Participant</h4>(New High-Res Indian Businesswoman)</div>
  </div>
  <div class='card'>
    <div class='img-wrap'><img src='https://images.unsplash.com/photo-1742981365880-698cfb84492d?auto=format&fit=crop&w=1000&q=85'></div>
    <div class='p'><h4>3. Enterprise L&D Head</h4>(Existing good photo)</div>
  </div>
  <div class='card'>
    <div class='img-wrap'><img src='https://images.unsplash.com/photo-1758685734463-98672a67dd1c?auto=format&fit=crop&w=1000&q=85'></div>
    <div class='p'><h4>4. Academic Director</h4>(New High-Res Indian Professor)</div>
  </div>
</div>
</body>
</html>
